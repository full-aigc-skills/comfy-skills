name: skill-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 scripts/lint_skills.py
      - run: python3 scripts/generate_quality_resources.py
      - name: Reject unsafe host-side effects
        run: |
          if grep -RniE 'without asking for confirmation|set system volume to maximum|osascript.*set volume|pactl set-sink-volume' skills; then
            echo '::error::unsafe host-side effect instruction found'
            exit 1
          fi
      - name: Checkout pinned TRACE evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: full-stack-skills/agent-skills
          ref: 91cd3e8e2aafd73d73fc037ce75dee7b6b663ffb
          path: .trace-evaluator
          persist-credentials: false
      - name: Enforce TRACE score floor
        run: python3 scripts/trace_gate.py --evaluator .trace-evaluator/skills/skill-trace-evaluation/scripts/trace_evaluate.py --threshold 4.5
